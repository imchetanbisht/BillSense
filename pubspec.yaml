version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^0.8.7+4
  http: 0.13.5
  google_mlkit_text_recognition: ^0.11.0
  intl: ^0.18.1
